name: JS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'crates/clhorde-web/static/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test crates/clhorde-web/static/tests/app.test.js
