name: Web Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'crates/clhorde-web/**'

jobs:
  js-tests:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test crates/clhorde-web/tests/js/app.test.js

  rust-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test -p clhorde-web
