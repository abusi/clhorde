# clhorde keymap configuration
# Copy to ~/.config/clhorde/keymap.toml and customize.
# Only override what you want — missing keys keep defaults.
# Key names: single chars ("q", "+"), or special names
#   ("Enter", "Esc", "Tab", "Up", "Down", "Left", "Right", "Space", "Backspace")

[normal]
quit = ["q"]
insert = ["i"]
select_next = ["j", "Down"]
select_prev = ["k", "Up"]
view_output = ["Enter"]
interact = ["s"]
increase_workers = ["+", "="]
decrease_workers = ["-"]
toggle_mode = ["m"]
retry = ["r"]
move_up = ["K"]
move_down = ["J"]
search = ["/"]
shrink_list = ["h"]
grow_list = ["l"]

[insert]
cancel = ["Esc"]
submit = ["Enter"]
accept_suggestion = ["Tab"]
next_suggestion = ["Down"]
prev_suggestion = ["Up"]

[view]
back = ["Esc", "q"]
scroll_down = ["j", "Down"]
scroll_up = ["k", "Up"]
interact = ["s"]
toggle_autoscroll = ["f"]
kill_worker = ["x"]
export = ["w"]
toggle_split = ["t"]

[interact]
back = ["Esc"]
send = ["Enter"]

[filter]
confirm = ["Enter"]
cancel = ["Esc"]

# [settings]
# list_ratio = 40        # Default split ratio for prompt list (10-90, default: 40)

# Quick prompts — send a predefined message with a single keypress in view mode.
# Keys here must not conflict with [view] bindings (view bindings take priority).
# Only works when the selected prompt is running or idle.
# [quick_prompts]
# g = "let's go"
# c = "continue"
# y = "yes"
# n = "no"

# Jira source — opt-in. Uncomment and fill in to ingest tickets from Jira.
# Validation runs at scheduler startup; per-queue errors are skipped with a
# logged warning, source-wide errors disable the whole source.
#
# [sources.jira]
# url = "https://your-site.atlassian.net"
# email = "bot@your-company.com"          # tied to the API token
# auth_token_env = "JIRA_API_TOKEN"        # env var holding the token
# poll_interval_secs = 30                  # clamped to a 15s floor at runtime
# max_concurrent_explore = 5               # cap on simultaneously active explore workers
# idle_explore_timeout = 86400             # seconds before the reaper kills an idle worker
#
# [sources.jira.queues.backlog]
# filter_jql = "project = PROJ AND labels = clhorde-plan"
# mode = "openspec"                        # only "openspec" is implemented; "direct" is reserved
# comments = true                          # post 🤖 lifecycle comments on the ticket
# labels = true                            # remove trigger_label on Exploring start
# trigger_label = "clhorde-plan"           # label removed when leaving Exploring
#
# [sources.jira.queues.backlog.transitions]
# exploring = "31"                         # Jira transition id; phase keys: exploring/archived/cancelled
# archived = "61"
